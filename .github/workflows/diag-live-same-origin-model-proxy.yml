name: Diagnostic Live Same Origin Model Proxy

on:
  push:
    branches:
      - diag/live-same-origin-model-proxy-20261001

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Compare direct and same-origin windmill bytes
        shell: bash
        run: |
          set -u
          for LABEL in DIRECT PROXY; do
            BODY="$(mktemp)"
            HDR="$(mktemp)"
            if [ "$LABEL" = "DIRECT" ]; then
              URL='https://maps-docs-team.web.app/assets/windmill.glb'
            else
              URL='https://admin.rekixo.com/api/3d-google-windmill'
            fi
            STATUS="$(curl --silent --show-error --location --output "$BODY" --dump-header "$HDR" --write-out '%{http_code}' --header 'Range: bytes=0-15' "$URL" || true)"
            echo "${LABEL}_STATUS=$STATUS"
            grep -Ei '^(HTTP/|location:|content-type|content-length|content-range|content-encoding|accept-ranges|x-rekixo-model-proxy):' "$HDR" || true
            echo -n "${LABEL}_HEX="
            xxd -p -l 16 "$BODY" | tr -d '\n'
            echo
            echo -n "${LABEL}_ASCII="
            head -c 16 "$BODY" | strings | head -1 || true
            echo
            rm -f "$BODY" "$HDR"
          done
      - name: Probe direct Jyoti Engine Geo bytes
        shell: bash
        run: |
          set -u
          BODY="$(mktemp)"
          HDR="$(mktemp)"
          URL='https://ar3dstudio.in/3Dprojects/api/releases/release_57c56ec2-50c0-4ee2-b916-df89bead1b94/geo-models/b162a605-c922-4d7d-a4d6-194e44c37a95/model.glb?v=1&geo=c413a6ff2fc3d869fb76222f69c005109c5a40b26a4a036394e52d3552e53e10'
          STATUS="$(curl --silent --show-error --location --output "$BODY" --dump-header "$HDR" --write-out '%{http_code}' --header 'Range: bytes=0-15' "$URL" || true)"
          echo "ENGINE_STATUS=$STATUS"
          grep -Ei '^(HTTP/|location:|content-type|content-length|content-range|content-encoding|accept-ranges|x-rekixo-sha256):' "$HDR" || true
          echo -n 'ENGINE_HEX='
          xxd -p -l 16 "$BODY" | tr -d '\n'
          echo
          echo -n 'ENGINE_ASCII='
          head -c 16 "$BODY" | strings | head -1 || true
          echo
          rm -f "$BODY" "$HDR"
      - name: Probe Jyoti Engine on admin same-origin path
        shell: bash
        run: |
          set -u
          BODY="$(mktemp)"
          HDR="$(mktemp)"
          URL='https://admin.rekixo.com/3Dprojects/api/releases/release_57c56ec2-50c0-4ee2-b916-df89bead1b94/geo-models/b162a605-c922-4d7d-a4d6-194e44c37a95/model.glb?v=1&geo=c413a6ff2fc3d869fb76222f69c005109c5a40b26a4a036394e52d3552e53e10'
          STATUS="$(curl --silent --show-error --location --output "$BODY" --dump-header "$HDR" --write-out '%{http_code}' --header 'Range: bytes=0-15' "$URL" || true)"
          echo "ADMIN_ENGINE_STATUS=$STATUS"
          grep -Ei '^(content-type|content-length|content-range|content-encoding|accept-ranges|x-rekixo-sha256):' "$HDR" || true
          echo -n 'ADMIN_ENGINE_HEX='
          xxd -p -l 16 "$BODY" | tr -d '\n'
          echo
          echo -n 'ADMIN_ENGINE_ASCII='
          head -c 16 "$BODY" | strings | head -1 || true
          echo
          rm -f "$BODY" "$HDR"
      - name: Inspect no-follow and identity transport
        shell: bash
        run: |
          set -u
          for LABEL in GOOGLE_IDENTITY ENGINE_NOFOLLOW ENGINE_IDENTITY; do
            BODY="$(mktemp)"
            HDR="$(mktemp)"
            if [ "$LABEL" = "GOOGLE_IDENTITY" ]; then
              URL='https://maps-docs-team.web.app/assets/windmill.glb'
              EXTRA=(--header 'Accept-Encoding: identity')
            else
              URL='https://ar3dstudio.in/3Dprojects/api/releases/release_57c56ec2-50c0-4ee2-b916-df89bead1b94/geo-models/b162a605-c922-4d7d-a4d6-194e44c37a95/model.glb?v=1&geo=c413a6ff2fc3d869fb76222f69c005109c5a40b26a4a036394e52d3552e53e10'
              EXTRA=()
              if [ "$LABEL" = "ENGINE_IDENTITY" ]; then EXTRA=(--header 'Accept-Encoding: identity'); fi
            fi
            STATUS="$(curl --silent --show-error --output "$BODY" --dump-header "$HDR" --write-out '%{http_code}' --header 'Range: bytes=0-15' "${EXTRA[@]}" "$URL" || true)"
            echo "${LABEL}_STATUS=$STATUS"
            grep -Ei '^(location|content-type|content-length|content-range|content-encoding|accept-ranges|server|cf-ray):' "$HDR" || true
            echo -n "${LABEL}_HEX="
            xxd -p -l 16 "$BODY" | tr -d '\n'
            echo
            rm -f "$BODY" "$HDR"
          done
      - name: Probe Jyoti same-origin bytes
        shell: bash
        run: |
          set -u
          BODY="$(mktemp)"
          HDR="$(mktemp)"
          URL='https://admin.rekixo.com/api/geo-3d-model-proxy?projectId=056fc8a2-0a39-40b8-87bc-20595141ffeb'
          STATUS="$(curl --silent --show-error --location --output "$BODY" --dump-header "$HDR" --write-out '%{http_code}' --header 'Range: bytes=0-15' "$URL" || true)"
          echo "JYOTI_STATUS=$STATUS"
          grep -Ei '^(HTTP/|location:|content-type|content-length|content-range|content-encoding|accept-ranges|x-rekixo-model-proxy|x-rekixo-sha256|x-rekixo-engine-model-transport):' "$HDR" || true
          echo -n 'JYOTI_HEX='
          xxd -p -l 16 "$BODY" | tr -d '\n'
          echo
          echo -n 'JYOTI_ASCII='
          head -c 16 "$BODY" | strings | head -1 || true
          echo
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "206" ]; then
            echo 'JYOTI_BODY:'
            cat "$BODY"
            echo
          fi
          rm -f "$BODY" "$HDR"