name: Diagnostic Live Same Origin Model Proxy

on:
  push:
    branches:
      - diag/live-same-origin-model-proxy-20261001

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Compare direct and same-origin windmill bytes
        shell: bash
        run: |
          set -u
          for LABEL in DIRECT PROXY; do
            BODY="$(mktemp)"
            HDR="$(mktemp)"
            if [ "$LABEL" = "DIRECT" ]; then
              URL='https://maps-docs-team.web.app/assets/windmill.glb'
            else
              URL='https://admin.rekixo.com/api/3d-google-windmill'
            fi
            STATUS="$(curl --silent --show-error --location --output "$BODY" --dump-header "$HDR" --write-out '%{http_code}' --header 'Range: bytes=0-15' "$URL" || true)"
            echo "${LABEL}_STATUS=$STATUS"
            grep -Ei '^(content-type|content-length|content-range|content-encoding|accept-ranges|x-rekixo-model-proxy):' "$HDR" || true
            echo -n "${LABEL}_HEX="
            xxd -p -l 16 "$BODY" | tr -d '\n'
            echo
            echo -n "${LABEL}_ASCII="
            head -c 16 "$BODY" | strings | head -1 || true
            echo
            rm -f "$BODY" "$HDR"
          done
      - name: Probe Jyoti same-origin bytes
        shell: bash
        run: |
          set -u
          BODY="$(mktemp)"
          HDR="$(mktemp)"
          URL='https://admin.rekixo.com/api/geo-3d-model-proxy?projectId=056fc8a2-0a39-40b8-87bc-20595141ffeb'
          STATUS="$(curl --silent --show-error --location --output "$BODY" --dump-header "$HDR" --write-out '%{http_code}' --header 'Range: bytes=0-15' "$URL" || true)"
          echo "JYOTI_STATUS=$STATUS"
          grep -Ei '^(content-type|content-length|content-range|content-encoding|accept-ranges|x-rekixo-model-proxy|x-rekixo-sha256|x-rekixo-engine-model-transport):' "$HDR" || true
          echo -n 'JYOTI_HEX='
          xxd -p -l 16 "$BODY" | tr -d '\n'
          echo
          echo -n 'JYOTI_ASCII='
          head -c 16 "$BODY" | strings | head -1 || true
          echo
          rm -f "$BODY" "$HDR"