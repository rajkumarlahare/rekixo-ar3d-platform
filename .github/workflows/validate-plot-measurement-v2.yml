name: Validate Rekixo AR3D Platform

on:
  # Validate every feature-branch commit directly. The production main branch
  # has its own deploy workflow with the same full regression suite.
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Source syntax
        run: npm run verify:source

      - name: Build
        run: npm run build

      - name: Full regression suite
        run: node --test tests/*.test.mjs

      - name: Diff whitespace safety
        run: git diff --check origin/main...HEAD

      - name: Platform module boundary contract
        run: node --test tests/platform-module-boundaries.test.mjs

      - name: Stage 3 legacy isolation contract
        run: node --test tests/stage-3-tiyansh-legacy-isolation.test.mjs

      - name: Live Tiyansh generic preflight
        run: node scripts/verify-tiyansh-generic-parity.mjs preflight
        env:
          REKIXO_PLATFORM_HOST: ${{ vars.REKIXO_PLATFORM_HOST }}
          REKIXO_WORKERS_SUBDOMAIN: ${{ vars.REKIXO_WORKERS_SUBDOMAIN }}

      - name: Measurement V2 contract
        run: |
          grep -q "CREATE TABLE IF NOT EXISTS plot_edge_measurements" drizzle/0023_rekixo_plot_measurement_v2.sql
          grep -q "sqmToSqftFactor" app/api/super-mapper/route.ts
          grep -q "frontFirstFourSideEdges" app/plot-mapper.tsx
          grep -q "REKIXO_PUBLIC_EDGE_DIMENSIONS_V11_LOGICAL_SIDE_LABEL" public/project/index.html
          grep -q "v=65" app/page.tsx
