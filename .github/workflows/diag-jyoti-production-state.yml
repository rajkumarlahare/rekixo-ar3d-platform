name: Diagnostic Jyoti Production State

on:
  push:
    branches:
      - diag/live-jyoti-super-admin-20261001
    paths:
      - .github/workflows/diag-jyoti-production-state.yml

permissions:
  contents: read

jobs:
  state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read Jyoti production state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npx wrangler d1 execute tiyansh-production --remote --json \
            --command "SELECT p.id AS projectId,p.name,p.slug,p.status AS projectStatus,p.public_status AS publicStatus,l.engine_project_id AS engineProjectId,l.engine_slug AS engineSlug,l.status AS linkStatus,l.public_enabled AS linkPublic,g.geo_project_id AS geoProjectId,g.engine_release_id AS releaseId,g.engine_release_version AS releaseVersion,g.engine_model_id AS modelId,g.longitude,g.latitude,g.altitude_m AS altitudeM,g.heading_deg AS headingDeg,g.pitch_deg AS pitchDeg,g.roll_deg AS rollDeg,g.scale,g.public_enabled AS placementPublic FROM projects p JOIN project_3d_links l ON l.platform_project_id=p.id LEFT JOIN geo_3d_placements g ON g.platform_project_id=p.id WHERE l.engine_project_id='302a8799-24de-4b9f-b217-95fb2c3883c8';" \
            > artifacts/jyoti-prod-state.json
          cat artifacts/jyoti-prod-state.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: jyoti-production-state
          path: artifacts/jyoti-prod-state.json
          if-no-files-found: error
