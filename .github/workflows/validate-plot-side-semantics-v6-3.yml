name: Validate Plot Side Semantics v6.3

on:
  push:
    branches:
      - feature/plot-side-semantics-v6-3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Full regression suite
        run: node --test tests/*.test.mjs
      - name: v6.3 semantic repair safety contract
        run: |
          grep -q "value===null||value===undefined" public/project/index.html
          grep -q "back_edge_index,depth2_edge_index" app/api/super-mapper/route.ts
          grep -q "Back exact label" app/plot-mapper.tsx
          grep -q "Depth B exact label" app/plot-mapper.tsx
          grep -q "runtime v57" tests/public-runtime-cache-policy.test.mjs
