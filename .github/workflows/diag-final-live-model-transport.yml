name: Diagnostic Final Live Model Transport

on:
  push:
    branches:
      - diag/live-model-transport-final-20261001

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify corrected Google windmill transport
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(mktemp)"
          HDR="$(mktemp)"
          URL='https://admin.rekixo.com/api/3d-google-windmill?transport=decoded-v2'
          STATUS="$(curl --compressed --silent --show-error --location --output "$BODY" --dump-header "$HDR" --write-out '%{http_code}' "$URL")"
          echo "WIND_STATUS=$STATUS"
          grep -Ei '^(content-type|content-length|content-encoding|x-rekixo-model-proxy|x-rekixo-upstream-content-encoding):' "$HDR" || true
          echo -n 'WIND_MAGIC='
          head -c 4 "$BODY"
          echo
          echo "WIND_SIZE=$(wc -c < "$BODY" | tr -d ' ')"
          test "$STATUS" = "200"
          test "$(head -c 4 "$BODY")" = "glTF"
          test "$(wc -c < "$BODY" | tr -d ' ')" = "78568"
          rm -f "$BODY" "$HDR"
      - name: Verify direct same-origin Jyoti Geo GLB
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(mktemp)"
          HDR="$(mktemp)"
          URL='https://admin.rekixo.com/3Dprojects/api/releases/release_57c56ec2-50c0-4ee2-b916-df89bead1b94/geo-models/b162a605-c922-4d7d-a4d6-194e44c37a95/model.glb?v=1&geo=c413a6ff2fc3d869fb76222f69c005109c5a40b26a4a036394e52d3552e53e10'
          STATUS="$(curl --silent --show-error --location --output "$BODY" --dump-header "$HDR" --write-out '%{http_code}' --header 'Range: bytes=0-15' "$URL")"
          echo "JYOTI_STATUS=$STATUS"
          grep -Ei '^(content-type|content-length|content-range|accept-ranges|x-rekixo-sha256):' "$HDR" || true
          echo -n 'JYOTI_MAGIC='
          head -c 4 "$BODY"
          echo
          test "$STATUS" = "206"
          test "$(head -c 4 "$BODY")" = "glTF"
          grep -Fqi 'content-range: bytes 0-15/4791564' "$HDR"
          grep -Fqi 'x-rekixo-sha256: c413a6ff2fc3d869fb76222f69c005109c5a40b26a4a036394e52d3552e53e10' "$HDR"
          rm -f "$BODY" "$HDR"
